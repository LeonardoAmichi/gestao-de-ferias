<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Buscar o Pedido de Férias por CPF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }

        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #0001;
        }

        input {
            width: 95%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }

        .erro {
            color: red;
        }

        .dados {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Buscar Pedido de Férias por CPF</h2>
        <input type="text" id="cpf" placeholder="Digite o CPF" />
        <button onclick="buscarFeriasPedido()" id="buscar">Buscar</button>
        <p id="erro" class="erro"></p>
        <div id="dados" class="dados"></div>
    </div>

    <script>

        document.getElementById('cpf').addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                document.getElementById('buscar').click();
            }
        });

        function formatarDataBR(dataISO) {
            if (!dataISO) return '';
            const [ano, mes, dia] = dataISO.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        function buscarFeriasPedido() {
            const cpf = document.getElementById('cpf').value.trim();
            const erro = document.getElementById('erro');
            const dados = document.getElementById('dados');
            erro.textContent = '';
            dados.innerHTML = '';
            if (!cpf) {
                erro.textContent = 'Digite um CPF válido.';
                return;
            }
            fetch(`ferias-pedidos/funcionario/${cpf}`)
                .then(res => {
                    if (!res.ok) throw new Error('Pedido de Férias não encontrado.');
                    return res.json();
                })
                .then(pedidos => {
                    if (!pedidos.length) {
                        dados.innerHTML = '<p>Nenhum pedido de férias encontrado para este funcionário.</p>';
                        return;
                    }
                    dados.innerHTML = pedidos.map(pedido => `
            <div style="margin-bottom: 20px;">
              <h3>Dados do Funcionário</h3>
              <p><strong>Nome do Funcionário:</strong> ${pedido.nomeFuncionario}</p>
              <p><strong>Número da Parcela utilizada:</strong> ${pedido.parcelaNumero}</p>
              <p><strong>Data de Início das Férias:</strong> ${formatarDataBR(pedido.dataInicio)}</p>
              <p><strong>Data Final das Férias:</strong> ${formatarDataBR(pedido.dataFim)}</p>
            </div>
          `).join('');
                })
                .catch(e => {
                    erro.textContent = e.message;
                });
        }
    </script>
</body>

</html>
